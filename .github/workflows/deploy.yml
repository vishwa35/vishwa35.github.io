name: Deploy Hugo Site

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master
  push:
    branches:
      - master

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build preview site
        run: hugo -t hugo-theme-codex --baseURL "https://vishwashah.me/preview/" -d public_preview

      - name: Checkout GitHub Pages repo
        uses: actions/checkout@v4
        with:
          repository: vishwa35/vishwa35.github.io
          path: pages_repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview to GitHub Pages
        run: |
          rm -rf pages_repo/preview
          mkdir -p pages_repo/preview
          cp -r public_preview/* pages_repo/preview/
          cd pages_repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add preview/
          git commit -m "Preview for PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" || echo "No changes to commit"
          git push origin master

  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo -t hugo-theme-codex

      - name: Deploy to GitHub Pages
        working-directory: ./public
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "rebuilding site $(date)" || echo "No changes to commit"
          git push origin master
