name: Deploy Hugo Site

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master
  push:
    branches:
      - master

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.123.0'
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: ${{ runner.os }}-hugo-${{ hashFiles('content/**', 'config.toml', 'themes/hugo-theme-codex/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build preview site
        run: hugo -t hugo-theme-codex --baseURL "https://vishwashah.com/preview/" -d public_preview

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_preview
          destination_dir: preview

  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.123.0'
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: ${{ runner.os }}-hugo-${{ hashFiles('content/**', 'config.toml', 'themes/hugo-theme-codex/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build site
        run: hugo -t hugo-theme-codex --baseURL "https://vishwashah.com/"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
